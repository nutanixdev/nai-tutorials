name: nai-tutorials

x-common-env-file: &common-env-file
  env_file:
    - path: ../.env
      required: false

services:
  opencode:
    build:
      context: .
      dockerfile: opencode/Dockerfile

    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do sleep 3600; done"]

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,mode=1777
      - /run:rw,nosuid,nodev,noexec
      - /home/nutanix/.config:rw,nosuid,nodev,uid=1000,gid=1000,mode=0755
      - /home/nutanix/.cache:rw,nosuid,nodev,uid=1000,gid=1000,mode=0755
      - /home/nutanix/.local/share:rw,nosuid,nodev,uid=1000,gid=1000,mode=0755
      - /home/nutanix/.local/state:rw,nosuid,nodev,uid=1000,gid=1000,mode=0755
      - /var/devcontainer:rw,nosuid,nodev,uid=1000,gid=1000,mode=0755

    volumes:
      - ..:/workspace:cached
      - vscode-server-data:/home/nutanix/.vscode-server

    <<: *common-env-file
    environment:
      OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX: "8192"
      NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/nai-mitm-ca.crt

    networks:
      - nai-dev-network

    depends_on:
      nginx:
        condition: service_started

  open-webui:
    build:
      context: .
      dockerfile: open-webui/Dockerfile
    restart: unless-stopped

    expose:
      - "8080"

    volumes:
      - open-webui-data:/app/backend/data

    <<: *common-env-file
    environment:
      WEBUI_AUTH: "False"
      ENABLE_OLLAMA_API: "False"
      HF_HUB_OFFLINE: 1
      OPENAI_API_BASE_URL: https://api.anthropic.com/v1
      # ENABLE_PERSISTENT_CONFIG: "False"
      # DEFAULT_USER_ROLE: "admin"

    networks:
      - nai-dev-network

    depends_on:
      nginx:
        condition: service_started

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped

    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certificates/api.anthropic.com.crt:/etc/nginx/tls/api.anthropic.com.crt:ro
      - ./certificates/api.anthropic.com.key:/etc/nginx/tls/api.anthropic.com.key:ro

    <<: *common-env-file

    environment:
      NGINX_ENVSUBST_FILTER: "^(ANTHROPIC_UPSTREAM_URL|ANTHROPIC_UPSTREAM_HOST)$"
      ANTHROPIC_UPSTREAM_URL: "https://ai.hpoc.nutanix.com/enterpriseai/gateway/v1/"
      ANTHROPIC_UPSTREAM_HOST: "ai.hpoc.nutanix.com"

    networks:
      nai-dev-network:
        aliases:
          - api.anthropic.com

networks:
  nai-dev-network:
    driver: bridge

volumes:
  vscode-server-data:
  open-webui-data:
